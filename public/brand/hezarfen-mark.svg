<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Hezarfen">
  <title>Hezarfen</title>
  <!-- Leading edge: four cells stepping up — the wing, and the shape a
       student's data takes once it becomes a plan. -->
  <g fill="#00add8">
    <rect x="30" y="166" width="44" height="44" rx="8"/>
    <rect x="86" y="122" width="44" height="44" rx="8"/>
    <rect x="142" y="78" width="44" height="44" rx="8"/>
    <rect x="198" y="34" width="44" height="44" rx="8"/>
  </g>
  <!-- Trailing feathers: the wing's body, recessive on purpose. -->
  <g fill="#eef6f8" opacity="0.28">
    <rect x="86" y="178" width="44" height="32" rx="8"/>
    <rect x="142" y="134" width="44" height="32" rx="8"/>
    <rect x="142" y="178" width="44" height="32" rx="8"/>
    <rect x="198" y="90" width="44" height="32" rx="8"/>
    <rect x="198" y="134" width="44" height="32" rx="8"/>
  </g>
</svg>
